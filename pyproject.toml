[project]
name = "mulec"
version = "0.1.0"
description = "Local-first audio to editable rehearsal charts"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "python-multipart>=0.0.20,<1",
  "librosa>=0.11,<0.12", "numpy>=2,<3", "scipy>=1.15,<2",
  "soundfile>=0.13,<1", "music21>=9.7,<10", "reportlab>=4.4,<5",
  "imageio-ffmpeg>=0.6,<0.7"
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1", "pypdf>=5,<7", "pymupdf>=1.25,<2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
